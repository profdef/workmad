<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <title>Invoice & Kuitansi · Pelatihan MAD-R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=22">
  <style>
    .doc-wrap { overflow: hidden; padding: 4px 0 24px; }
    .doc { width: 794px; min-height: 1123px; margin: 0 auto; background: #fff; color: #1f2340; position: relative; transform-origin: top left;
      font: 13.5px/1.55 "Plus Jakarta Sans", sans-serif; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; }
    .doc .bar { height: 10px; background: linear-gradient(90deg, #070b2b, #5b2bd6 45%, #a855f7 70%, #c0141a); }
    .doc .in { padding: 40px 56px 32px; flex: 1; display: flex; flex-direction: column; }
    .doc .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .doc .hd img { width: 230px; height: auto; }
    .doc .hd .org { font-size: 11.5px; color: #5b5f8a; margin-top: 8px; line-height: 1.5; }
    .doc .ttl { text-align: right; }
    .doc .ttl h1 { font: 800 30px Poppins, sans-serif; color: #0d1340; margin: 0; letter-spacing: .04em; }
    .doc .ttl .sub { font-size: 12px; color: #5b5f8a; }
    .doc .ttl .no { font: 700 13px "JetBrains Mono", monospace; color: #5b2bd6; margin-top: 6px; }
    .doc .meta { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; margin: 30px 0 22px; padding: 18px 0; border-top: 1px solid #e6e6f0; border-bottom: 1px solid #e6e6f0; }
    .doc .lbl { font: 700 10.5px Poppins, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #a855f7; margin-bottom: 6px; }
    .doc .meta b { color: #0d1340; font-size: 15px; }
    .doc .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
    .doc .kv2 span:nth-child(odd) { color: #5b5f8a; }
    .doc .kv2 span:nth-child(even) { color: #0d1340; font-weight: 600; text-align: right; }
    .doc table { width: 100%; border-collapse: collapse; }
    .doc th { font: 700 10.5px Poppins, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #fff; background: #0d1340; padding: 10px 12px; text-align: left; }
    .doc th:last-child, .doc td:last-child { text-align: right; white-space: nowrap; }
    .doc td { padding: 12px; border-bottom: 1px solid #ececf4; vertical-align: top; }
    .doc td .d { color: #5b5f8a; font-size: 12px; }
    .doc .tot { margin-left: auto; width: 330px; margin-top: 10px; }
    .doc .tot div { display: flex; justify-content: space-between; padding: 6px 12px; }
    .doc .tot .grand { background: #f3eefe; border-radius: 8px; font: 800 17px Poppins, sans-serif; color: #0d1340; margin-top: 4px; padding: 10px 12px; }
    .doc .words { margin-top: 14px; padding: 10px 14px; border-left: 4px solid #a855f7; background: #faf8ff; font-style: italic; color: #1c1a6e; }
    .doc .box { margin-top: 20px; padding: 14px 16px; border-radius: 10px; border: 1px solid #e6e6f0; background: #fbfbfe; }
    .doc .box b { color: #0d1340; }
    .doc .totrow { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 10px; }
    .doc .totrow .tot { margin-top: 0; }
    .doc .stamp { margin-left: 30px; transform: rotate(-12deg); border: 5px double #16a34a; color: #16a34a; border-radius: 12px;
      padding: 8px 22px; font: 800 38px Poppins, sans-serif; letter-spacing: .12em; opacity: .85; text-align: center; line-height: 1.05; }
    .doc .stamp small { display: block; font: 700 11px "JetBrains Mono", monospace; letter-spacing: .04em; }
    .doc .stamp { white-space: nowrap; }
    .doc .stamp.due { border-color: #d97706; color: #d97706; font-size: 22px; padding: 8px 16px; }
    .doc .ft { margin-top: auto; padding-top: 26px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
    .doc .ft .note { font-size: 11px; color: #5b5f8a; max-width: 420px; }
    .doc .ft .sign { text-align: center; min-width: 220px; font-size: 12px; color: #5b5f8a; }
    .doc .ft .sign b { display: block; color: #0d1340; font: 700 13px Poppins, sans-serif; border-top: 1.5px solid #0d1340; padding-top: 6px; margin-top: 54px; }
    .doc .motto { background: #0d1340; color: #fff; text-align: center; font: italic 600 12px Poppins, sans-serif; padding: 9px; letter-spacing: .06em; }
    .doc .motto span { color: #f87171; }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { background: #fff !important; }
      body::before { display: none; }
      main { padding: 0 !important; }
      .doc-wrap { padding: 0; overflow: visible; }
      .doc { box-shadow: none; transform: none !important; margin: 0 !important; width: 210mm; min-height: 297mm; }
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main class="container" style="padding:28px 16px 48px">
    <div id="askBox" class="no-print hidden" style="max-width:640px;margin:0 auto">
      <div class="eyebrow">Dokumen Pembayaran</div>
      <h1 style="font-size:28px;margin-top:.3em">Cetak Invoice / Kuitansi</h1>
      <p class="muted">Masukkan no. pendaftaran serta email atau no. WhatsApp yang Anda gunakan saat mendaftar.</p>
      <form id="askForm" class="card" novalidate>
        <div class="row">
          <div class="field"><label class="req" for="aId">No. pendaftaran</label><input id="aId" placeholder="MAD-261014-0001" autocapitalize="characters"></div>
          <div class="field"><label class="req" for="aContact">Email atau no. WhatsApp</label><input id="aContact"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Tampilkan Dokumen</button>
        <div id="askErr" class="alert alert-err hidden"></div>
      </form>
    </div>
    <div id="bar" class="no-print hidden" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn btn-primary" type="button" onclick="print()">🖨 Cetak / Simpan PDF</button>
      <button class="btn hidden" type="button" id="swapBtn"></button>
      <a class="btn" href="javascript:history.back()">← Kembali</a>
      <div class="small muted" style="width:100%;text-align:center">Di dialog cetak pilih <b>Save as PDF</b>, kertas <b>A4</b>, margin <b>None</b>, aktifkan <b>Background graphics</b>.</div>
    </div>
    <div class="doc-wrap hidden" id="docWrap"><div class="doc" id="doc"></div></div>
  </main>
  <div id="footer"></div>

  <script src="assets/config.js?v=22"></script>
  <script src="assets/api.js?v=11"></script>
  <script src="assets/common.js?v=12"></script>
  <script>
  (async function () {
    const C = APP_CONFIG, T = C.TRAINING, O = C.ORGANIZER;
    const $ = (id) => document.getElementById(id);
    renderChrome("");
    let doc = null, mode = "";

    // Terbilang (Rupiah)
    function terbilang(n) {
      const s = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
      n = Math.floor(n);
      if (n < 12) return s[n];
      if (n < 20) return terbilang(n - 10) + " belas";
      if (n < 100) return terbilang(n / 10) + " puluh" + (n % 10 ? " " + terbilang(n % 10) : "");
      if (n < 200) return "seratus" + (n % 100 ? " " + terbilang(n - 100) : "");
      if (n < 1000) return terbilang(n / 100) + " ratus" + (n % 100 ? " " + terbilang(n % 100) : "");
      if (n < 2000) return "seribu" + (n % 1000 ? " " + terbilang(n - 1000) : "");
      if (n < 1e6) return terbilang(n / 1000) + " ribu" + (n % 1000 ? " " + terbilang(n % 1000) : "");
      if (n < 1e9) return terbilang(n / 1e6) + " juta" + (n % 1e6 ? " " + terbilang(n % 1e6) : "");
      return terbilang(n / 1e9) + " miliar" + (n % 1e9 ? " " + terbilang(n % 1e9) : "");
    }
    const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    const d = (iso, t) => (iso ? fmtDate(iso, t) : "—");

    function render() {
      const r = doc, receipt = mode === "receipt";
      const amount = receipt ? (r.paidAmount || r.total) : r.total;
      document.title = (receipt ? "Kuitansi " + r.receiptNo : "Invoice " + r.invoiceNo) + " · " + r.name;
      $("doc").innerHTML =
        '<div class="bar"></div><div class="in">' +
        '<div class="hd"><div><img src="' + O.logo + '" alt="publichealth.id — ' + esc(O.motto) + '"><div class="org"><b style="color:#0d1340">publichealth.id</b> · Penyelenggara Pelatihan<br>' +
          "Padang, Sumatera Barat · WA +" + C.ADMIN_WA + "<br>" + esc(T.email) + " · publichealth.id</div></div>" +
        '<div class="ttl"><h1>' + (receipt ? "KUITANSI" : "INVOICE") + '</h1><div class="sub">' + (receipt ? "Bukti Pembayaran Diterima" : "Tagihan Biaya Pelatihan") +
          '</div><div class="no">' + esc(receipt ? r.receiptNo : r.invoiceNo) + "</div></div></div>" +
        '<div class="meta"><div><div class="lbl">' + (receipt ? "Telah diterima dari" : "Ditagihkan kepada") + "</div><b>" + esc(r.name) + "</b><br>" + esc(r.institution) +
          "<br>" + esc([r.city, r.province].filter(Boolean).join(", ")) + "<br>" + esc(r.email) + " · " + esc(r.phone) + "</div>" +
        '<div class="kv2"><span>No. pendaftaran</span><span>' + esc(r.id) + "</span><span>Tanggal invoice</span><span>" + esc(d(r.createdAt)) + "</span>" +
          (receipt ? "<span>Tanggal verifikasi</span><span>" + esc(d(r.paidAt, true)) + "</span><span>No. invoice</span><span>" + esc(r.invoiceNo) + "</span>"
                   : "<span>Status</span><span>" + esc(r.status) + "</span><span>Jatuh tempo</span><span>" + esc(fmtDate(T.closeDate + "T12:00:00+07:00")) + "</span>") + "</div></div>" +
        '<table><thead><tr><th style="width:36px">#</th><th>Uraian</th><th>Jumlah</th></tr></thead><tbody>' +
          '<tr><td>1</td><td><b style="color:#0d1340">Biaya Pelatihan Online</b><br>' + esc(T.title + " " + T.subtitle) + '<div class="d">' + esc(r.batch) + " · Kategori: " + esc(r.category) +
          " · " + esc(T.hours) + "</div></td><td>" + rupiah(r.price) + "</td></tr>" +
          (r.discount ? '<tr><td>2</td><td>Potongan pembeli buku<div class="d">' + esc(r.bookOrderId || "Pembeli buku terverifikasi") + "</div></td><td>− " + rupiah(r.discount) + "</td></tr>" : "") +
          '<tr><td>' + (r.discount ? 3 : 2) + '</td><td>Kode unik pembayaran<div class="d">Untuk identifikasi transfer otomatis</div></td><td>' + rupiah(r.uniqueCode) + "</td></tr>" +
        "</tbody></table>" +
        '<div class="totrow">' + (receipt ? '<div class="stamp">LUNAS<small>' + esc(d(r.paidAt)) + "</small></div>"
                 : (r.status === "Dibatalkan" ? '<div class="stamp due" style="border-color:#dc2626;color:#dc2626">DIBATALKAN</div>' : '<div class="stamp due">BELUM DIBAYAR</div>')) +
        '<div class="tot"><div><span>Subtotal</span><span>' + rupiah(r.total) + "</span></div>" +
          (receipt ? '<div><span>Dibayar (' + esc(r.payerName || "—") + ")</span><span>" + rupiah(amount) + "</span></div>" : "") +
          '<div class="grand"><span>' + (receipt ? "Total diterima" : "Total tagihan") + "</span><span>" + rupiah(amount) + "</span></div></div></div>" +
        '<div class="words">Terbilang: ' + cap(terbilang(amount)) + " rupiah</div>" +
        (receipt
          ? '<div class="box">Pembayaran melalui transfer ke <b>' + esc(r.payment) + "</b> telah <b>diverifikasi</b>. Peserta memperoleh akses penuh ke Portal Peserta: 20 modul, bahan presentasi PDF &amp; data latihan, sesi live, dan e-sertifikat.</div>"
          : '<div class="box"><b>Cara pembayaran:</b> transfer <b>tepat ' + rupiah(r.total) + "</b> (termasuk kode unik) ke <b>" + esc(r.payment) +
            "</b>, lalu unggah bukti transfer di " + esc(API.base) + "konfirmasi.html. Kode akses materi dikirim ke email setelah pembayaran diverifikasi.</div>") +
        '<div class="ft"><div class="note">Dokumen ini diterbitkan secara elektronik oleh sistem pelatihan publichealth.id dan sah tanpa tanda tangan basah.<br>Dicetak ' +
          esc(fmtDate(new Date().toISOString(), true)) + " WIB.</div>" +
        '<div class="sign">Padang, ' + esc(d(receipt ? r.paidAt : r.createdAt)) + "<br>Penyelenggara<b>publichealth.id</b></div></div>" +
        '</div><div class="motto">publichealth.id · <span>' + esc(O.motto) + "</span></div>";
      $("docWrap").classList.remove("hidden");
      $("bar").classList.remove("hidden");
      $("askBox").classList.add("hidden");
      const sw = $("swapBtn");
      if (r.paid) { sw.classList.remove("hidden"); sw.textContent = receipt ? "📄 Lihat invoice" : "🧾 Lihat kuitansi"; }
      fit();
    }
    function fit() {
      const el = $("doc"), k = Math.min(1, $("docWrap").clientWidth / 794);
      el.style.transform = k < 1 ? "scale(" + k + ")" : "";
      el.style.marginBottom = k < 1 ? -(el.offsetHeight * (1 - k)) + "px" : "";
      el.style.marginLeft = k < 1 ? "0" : "auto";
    }
    addEventListener("resize", () => doc && fit());
    $("swapBtn").addEventListener("click", () => { mode = mode === "receipt" ? "invoice" : "receipt"; render(); });

    async function load(req) {
      const res = req.admin ? await API.invoiceAdmin(req.admin, req.id) : await API.invoice(req.id, req.contact);
      doc = res.doc;
      const want = new URLSearchParams(location.search).get("jenis");
      mode = doc.paid && want !== "invoice" ? "receipt" : "invoice";
      render();
    }

    // Permintaan disimpan di sessionStorage oleh halaman asal (tanpa data pribadi di URL)
    let req = null;
    try { req = JSON.parse(sessionStorage.getItem("mad_doc") || "null"); } catch (e) {}
    const s = Session.get();
    if (!req && s && s.id) req = { id: s.id, contact: s.email };
    if (req) { try { await load(req); return; } catch (e) { $("askErr").textContent = e.message; $("askErr").classList.remove("hidden"); } }
    $("askBox").classList.remove("hidden");
    $("aId").value = new URLSearchParams(location.search).get("id") || "";
    $("askForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("askErr").classList.add("hidden");
      try {
        const r = { id: $("aId").value.trim().toUpperCase(), contact: $("aContact").value.trim() };
        await load(r);
        sessionStorage.setItem("mad_doc", JSON.stringify(r));
      } catch (ex) { $("askErr").textContent = ex.message; $("askErr").classList.remove("hidden"); }
    });
  })();
  </script>
</body>
</html>
