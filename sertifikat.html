<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <title>Sertifikat · Pelatihan MAD-R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=5">
  <style>
    /* ===== Sertifikat A4 landscape (297 × 210 mm) — satu halaman ===== */
    .cert-wrap { overflow: hidden; padding: 4px 0 24px; }
    .cert {
      --navy: #0d1340; --ink: #1f2340; --gold: #b08d3c; --gold-2: #d8b968; --muted: #5d6185;
      width: 297mm; height: 209mm; margin: 0 auto; position: relative; overflow: hidden; box-sizing: border-box;
      background:
        radial-gradient(120mm 90mm at 50% 45%, rgba(216,185,104,.10), transparent 70%),
        repeating-linear-gradient(45deg, rgba(13,19,64,.018) 0 1px, transparent 1px 7px),
        #fffdf7;
      color: var(--ink); font-family: "Plus Jakarta Sans", sans-serif; transform-origin: top left;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    /* Bingkai ganda + ornamen sudut */
    .cert .frame-1 { position: absolute; inset: 7mm; border: 1.2mm solid var(--navy); }
    .cert .frame-2 { position: absolute; inset: 10mm; border: .35mm solid var(--gold); }
    .cert .corner { position: absolute; width: 16mm; height: 16mm; border: .9mm solid var(--gold); }
    .cert .corner::after { content: ""; position: absolute; width: 3mm; height: 3mm; background: var(--gold); transform: rotate(45deg); }
    .cert .c-tl { top: 12.5mm; left: 12.5mm; border-right: 0; border-bottom: 0; } .cert .c-tl::after { top: -2mm; left: -2mm; }
    .cert .c-tr { top: 12.5mm; right: 12.5mm; border-left: 0; border-bottom: 0; } .cert .c-tr::after { top: -2mm; right: -2mm; }
    .cert .c-bl { bottom: 12.5mm; left: 12.5mm; border-right: 0; border-top: 0; } .cert .c-bl::after { bottom: -2mm; left: -2mm; }
    .cert .c-br { bottom: 12.5mm; right: 12.5mm; border-left: 0; border-top: 0; } .cert .c-br::after { bottom: -2mm; right: -2mm; }
    .cert .content { position: absolute; inset: 17mm 24mm 15mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .cert .logo { height: 15mm; width: auto; display: block; }
    .cert .title { font: 700 13.5mm/1 "Playfair Display", Georgia, serif; letter-spacing: .32em; color: var(--navy); margin: 7mm 0 0; padding-left: .32em; }
    .cert .subtitle { display: flex; align-items: center; gap: 4mm; margin-top: 2.5mm; font: 600 3.4mm "Plus Jakarta Sans", sans-serif; letter-spacing: .42em; color: var(--gold); text-transform: uppercase; }
    .cert .subtitle::before, .cert .subtitle::after { content: ""; width: 22mm; height: .3mm; background: linear-gradient(90deg, transparent, var(--gold)); }
    .cert .subtitle::after { transform: scaleX(-1); }
    .cert .no { font: 500 3.1mm "JetBrains Mono", monospace; color: var(--muted); margin-top: 2.5mm; letter-spacing: .05em; }
    .cert .given { margin-top: 8mm; font: italic 400 4.6mm "Playfair Display", Georgia, serif; color: var(--muted); }
    .cert .nm { font: 400 15mm/1.15 "Great Vibes", cursive; color: var(--navy); margin-top: 1mm; padding: 0 10mm 1.5mm; min-width: 150mm;
      border-bottom: .35mm solid var(--gold); }
    .cert .inst { font: 500 3.8mm "Plus Jakarta Sans", sans-serif; color: var(--muted); margin-top: 2mm; letter-spacing: .02em; }
    .cert .desc { margin-top: 7mm; font: 400 3.9mm/1.6 "Plus Jakarta Sans", sans-serif; color: var(--ink); max-width: 210mm; }
    .cert .desc .course { display: block; font: 700 5mm/1.3 "Playfair Display", Georgia, serif; color: var(--navy); margin: 1.2mm 0; }
    .cert .desc b { color: var(--navy); }
    .cert .bottom { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8mm; }
    .cert .verify { display: flex; align-items: flex-end; gap: 3.5mm; text-align: left; font-size: 2.7mm; line-height: 1.45; color: var(--muted); }
    .cert .qr { width: 21mm; height: 21mm; padding: 1.2mm; background: #fff; border: .3mm solid #ddd; flex: none; }
    .cert .qr img, .cert .qr canvas { width: 100% !important; height: 100% !important; display: block; }
    .cert .verify b { color: var(--navy); font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 2.5mm; overflow-wrap: anywhere; }
    /* Segel */
    .cert .seal { width: 30mm; height: 30mm; border-radius: 50%; position: relative; display: grid; place-items: center; margin-bottom: 1mm;
      background: radial-gradient(circle at 35% 30%, #f3dc95, var(--gold-2) 40%, var(--gold) 75%, #8a6b26);
      border: .6mm solid #8a6b26; outline: .3mm solid var(--gold); outline-offset: .8mm; }
    .cert .seal::before { content: ""; position: absolute; inset: 2.6mm; border-radius: 50%; border: .3mm dashed rgba(255,255,255,.85); }
    .cert .seal span { color: #fff; font: 700 1.95mm/1.3 "Plus Jakarta Sans", sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    .cert .seal span b { display: block; font: 800 6.5mm/1 "Playfair Display", serif; letter-spacing: 0; margin: .6mm 0; }
    .cert .sign { text-align: center; justify-self: end; min-width: 72mm; font-size: 3.1mm; color: var(--muted); }
    .cert .sign .sp { height: 16mm; }
    .cert .sign b { display: block; color: var(--navy); font: 700 3.7mm "Plus Jakarta Sans", sans-serif; border-top: .3mm solid var(--navy); padding-top: 1.5mm; }

    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; min-height: 0 !important; height: auto !important; }
      body { display: block !important; }
      body::before { display: none !important; }
      /* Hanya sertifikat yang dicetak → tepat satu halaman */
      body > :not(main) { display: none !important; }
      main { padding: 0 !important; margin: 0 !important; max-width: none !important; width: auto !important; }
      main > :not(#certWrap) { display: none !important; }
      .cert-wrap { padding: 0 !important; margin: 0 !important; overflow: visible !important; }
      .cert { box-shadow: none !important; transform: none !important; margin: 0 !important; page-break-after: avoid; break-after: avoid; break-inside: avoid; }
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main class="container" style="padding:32px 16px 48px">
    <div class="no-print" id="verifyBox" style="max-width:640px;margin:0 auto 24px">
      <div class="eyebrow">Verifikasi</div>
      <h1 style="font-size:28px;margin-top:.3em">Cek Keaslian Sertifikat</h1>
      <form id="vForm" class="card" novalidate style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="vNo" placeholder="MAD-R/2026/0001" class="mono" style="flex:1;min-width:220px">
        <button class="btn btn-primary" type="submit">Verifikasi</button>
      </form>
      <div id="vOut"></div>
    </div>
    <div id="printBar" class="no-print hidden" style="display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
      <button class="btn btn-primary" type="button" onclick="print()">🖨 Cetak / Simpan PDF</button>
      <a class="btn" href="portal.html#sertifikat">← Kembali ke Portal</a>
      <div class="small muted" style="width:100%;text-align:center">Di dialog cetak pilih <b>Save as PDF</b>, ukuran <b>A4</b>, orientasi <b>Landscape</b>, margin <b>None</b>, skala <b>100%</b>, aktifkan <b>Background graphics</b> — hasilnya 1 halaman.</div>
    </div>
    <div class="cert-wrap hidden" id="certWrap"><div class="cert" id="cert"></div></div>
  </main>
  <div id="footer"></div>

  <script src="assets/config.js?v=5"></script>
  <script src="assets/api.js?v=5"></script>
  <script src="assets/common.js?v=5"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
  (async function () {
    const C = APP_CONFIG, T = C.TRAINING;
    const $ = (id) => document.getElementById(id);
    renderChrome("sertifikat");
    const qs = new URLSearchParams(location.search);
    const verifyUrl = API.base + "sertifikat.html?no=";

    function render(c) {
      const O = C.ORGANIZER, date = fmtDate(c.date + "T12:00:00+07:00");
      const vurl = verifyUrl + encodeURIComponent(c.no);
      $("cert").innerHTML =
        '<div class="frame-1"></div><div class="frame-2"></div>' +
        '<div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>' +
        '<div class="content">' +
          '<img class="logo" src="' + O.logo + '" alt="publichealth.id — ' + esc(O.motto) + '">' +
          '<div class="title">SERTIFIKAT</div>' +
          '<div class="subtitle">Pelatihan Online</div>' +
          '<div class="no">Nomor: ' + esc(c.no) + "</div>" +
          '<div class="given">Dengan bangga diberikan kepada</div>' +
          '<div class="nm">' + esc(c.name) + "</div>" +
          '<div class="inst">' + esc(c.institution) + "</div>" +
          '<div class="desc">atas partisipasinya sebagai <b>Peserta</b> dan telah menyelesaikan seluruh rangkaian Pelatihan Online' +
            '<span class="course">' + esc(T.title) + " " + esc(T.subtitle) + "</span>" +
            "yang diselenggarakan oleh <b>publichealth.id</b> · " + esc(c.batch) + " · <b>" + esc(c.jp) + " Jam Pelajaran (JP)</b></div>" +
          '<div class="bottom">' +
            '<div class="verify"><div class="qr" id="qr"></div><div>Pindai untuk verifikasi keaslian<br><b>' + esc(verifyUrl.replace(/^https?:\/\//, "")) + "<wbr>" + esc(c.no) + "</b><br>Diterbitkan " + esc(date) + "</div></div>" +
            '<div class="seal"><span>publichealth.id<b>' + esc(c.jp) + " JP</b>Tersertifikasi</span></div>" +
            '<div class="sign">Padang, ' + esc(date) + '<div class="sp"></div><b>' + esc(T.instructor) + "</b>Narasumber</div>" +
          "</div>" +
        "</div>";
      try { new QRCode($("qr"), { text: vurl, width: 256, height: 256, colorDark: "#0d1340", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); }
      catch (e) { $("qr").remove(); }
      $("certWrap").classList.remove("hidden");
      fit();
    }
    function fit() {
      const el = $("cert"), W = el.offsetWidth, H = el.offsetHeight;
      const k = Math.min(1, $("certWrap").clientWidth / W);
      el.style.transform = k < 1 ? "scale(" + k + ")" : "";
      el.style.marginBottom = k < 1 ? -(H * (1 - k)) + "px" : "";
      el.style.marginLeft = k < 1 ? "0" : "";
    }
    addEventListener("resize", () => $("cert").innerHTML && fit());

    async function verify(no) {
      $("vOut").innerHTML = '<p class="muted">Memeriksa…</p>';
      try {
        const r = await API.verify(no);
        if (!r.valid) { $("vOut").innerHTML = '<div class="alert alert-err">✗ Nomor sertifikat <b>' + esc(no) + "</b> tidak terdaftar.</div>"; $("certWrap").classList.add("hidden"); return; }
        $("vOut").innerHTML = '<div class="alert alert-ok">✓ Sertifikat <b>SAH</b> — diterbitkan untuk <b>' + esc(r.cert.name) + "</b> (" + esc(r.cert.institution) + "), " + esc(fmtDate(r.cert.date + "T12:00:00+07:00")) + ", diterbitkan oleh publichealth.id.</div>";
        render(r.cert);
      } catch (e) { $("vOut").innerHTML = '<div class="alert alert-err">' + esc(e.message) + "</div>"; }
    }
    $("vForm").addEventListener("submit", (e) => { e.preventDefault(); const no = $("vNo").value.trim(); if (no) verify(no); });

    if (qs.get("cetak")) {
      const s = Session.get();
      if (!s) { location.replace("masuk.html?next=" + encodeURIComponent("sertifikat.html?cetak=1")); return; }
      try {
        const r = await API.login(s.email, s.code, true);
        const p = r.participant;
        if (p.certIssued && !p.certNo) { location.replace("evaluasi.html"); return; }
        if (!p.certNo) throw new Error("Sertifikat Anda belum diterbitkan.");
        $("verifyBox").classList.add("hidden");
        $("printBar").classList.remove("hidden");
        render({ no: p.certNo, name: p.name, institution: p.institution, date: p.certDate, jp: p.jp, batch: p.batch });
      } catch (e) { $("vOut").innerHTML = '<div class="alert alert-err">' + esc(e.message) + "</div>"; }
    } else if (qs.get("no")) { $("vNo").value = qs.get("no"); verify(qs.get("no")); }
  })();
  </script>
</body>
</html>
