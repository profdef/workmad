<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <title>Sertifikat · Pelatihan MAD-R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=5">
  <style>
    .cert-wrap { overflow: hidden; padding: 8px 0 24px; }
    .cert {
      --red: #bc1416; --red-dark: #8c0d10; --gray: #505050; --char: #2f2f31; --muted: #6b6b6e;
      width: 1122px; height: 792px; margin: 0 auto; position: relative; background: #fff; color: var(--char); overflow: hidden;
      font-family: "Plus Jakarta Sans", sans-serif; box-shadow: 0 20px 60px rgba(0,0,0,.5); transform-origin: top left;
    }
    .cert .band { position: absolute; inset: 0 auto 0 0; width: 250px; background: linear-gradient(170deg, #fdfbf9 0%, #f5f1ee 55%, #eee8e4 100%); }
    .cert .band svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .cert .band::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 5px; background: linear-gradient(180deg, var(--red), var(--red-dark)); }
    .cert .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .cert .org-logo { width: 260px; height: auto; display: block; margin-top: 2px; }
    .cert .org-by { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); text-align: right; margin-bottom: 6px; }
    .cert .motto { position: absolute; left: 250px; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      padding: 0 70px; color: #fff; font: italic 600 13px Poppins, sans-serif; letter-spacing: .06em;
      background: linear-gradient(90deg, #2f2f31, #505050 55%, var(--red)); }
    .cert .body { position: absolute; left: 310px; right: 70px; top: 56px; bottom: 66px; display: flex; flex-direction: column; }
    .cert .kicker { font: 700 13px Poppins, sans-serif; letter-spacing: .32em; color: var(--red); text-transform: uppercase; }
    .cert h1 { font: 800 54px Poppins, sans-serif; color: var(--char); margin: 6px 0 0; letter-spacing: .02em; }
    .cert .no { font: 500 13px "JetBrains Mono", monospace; color: var(--muted); margin-top: 4px; }
    .cert .given { margin-top: 22px; font-size: 16px; color: var(--muted); }
    .cert .nm { white-space: nowrap; overflow: hidden; font: 400 64px "Great Vibes", cursive; color: var(--char); line-height: 1.15; margin: 6px 0 2px; border-bottom: 2px solid; border-image: linear-gradient(90deg, var(--red), #505050 70%, #c9c9cc) 1; padding-bottom: 6px; }
    .cert .inst { font-size: 15px; color: var(--muted); }
    .cert .desc { margin-top: 22px; font-size: 16px; line-height: 1.6; color: #3a3a3d; }
    .cert .desc b { color: var(--char); }
    .cert .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; }
    .cert .seal { width: 132px; height: 156px; flex: none; margin-bottom: -10px; }
    .cert .sign { text-align: center; min-width: 270px; }
    .cert .sign .sp { height: 70px; }
    .cert .sign b { display: block; border-top: 1.5px solid var(--char); padding-top: 6px; font-family: Poppins, sans-serif; font-size: 14.5px; white-space: nowrap; }
    .cert .sign span { font-size: 12.5px; color: var(--muted); }
    .cert .verify { display: flex; align-items: flex-end; gap: 12px; font-size: 11px; line-height: 1.5; color: var(--muted); max-width: 300px; }
    .cert .verify b { font-family: "JetBrains Mono", monospace; color: var(--char); font-size: 10px; overflow-wrap: anywhere; }
    .cert .qr { width: 84px; height: 84px; flex: none; padding: 4px; background: #fff; border: 1px solid #d9d9e6; }
    .cert .qr img, .cert .qr canvas { width: 100% !important; height: 100% !important; display: block; }
    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; min-height: 0 !important; height: auto !important; }
      body { display: block !important; }
      body::before { display: none !important; }
      /* Hanya sertifikat yang dicetak → tepat satu halaman A4 */
      body > :not(main) { display: none !important; }
      main { padding: 0 !important; margin: 0 !important; max-width: none !important; width: auto !important; }
      main > :not(#certWrap) { display: none !important; }
      .cert-wrap { padding: 0 !important; margin: 0 !important; overflow: visible !important; }
      .cert { box-shadow: none !important; transform: none !important; margin: 0 !important; break-inside: avoid; }
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main class="container" style="padding:32px 16px 48px">
    <div class="no-print" id="verifyBox" style="max-width:640px;margin:0 auto 24px">
      <div class="eyebrow">Verifikasi</div>
      <h1 style="font-size:28px;margin-top:.3em">Cek Keaslian Sertifikat</h1>
      <form id="vForm" class="card" novalidate style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="vNo" placeholder="MAD-R/2026/0001" class="mono" style="flex:1;min-width:220px">
        <button class="btn btn-primary" type="submit">Verifikasi</button>
      </form>
      <div id="vOut"></div>
    </div>
    <div id="printBar" class="no-print hidden" style="display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
      <button class="btn btn-primary" type="button" onclick="print()">🖨 Cetak / Simpan PDF</button>
      <a class="btn" href="portal.html#sertifikat">← Kembali ke Portal</a>
      <div class="small muted" style="width:100%;text-align:center">Di dialog cetak pilih <b>Save as PDF</b>, ukuran <b>A4</b>, orientasi <b>Landscape</b>, margin <b>None</b>, skala <b>100%</b>, aktifkan <b>Background graphics</b> — hasilnya 1 halaman.</div>
    </div>
    <div class="cert-wrap hidden" id="certWrap"><div class="cert" id="cert"></div></div>
  </main>
  <div id="footer"></div>

  <script src="assets/config.js?v=5"></script>
  <script src="assets/api.js?v=5"></script>
  <script src="assets/common.js?v=5"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
  (async function () {
    const C = APP_CONFIG, T = C.TRAINING;
    const $ = (id) => document.getElementById(id);
    renderChrome("sertifikat");
    const qs = new URLSearchParams(location.search);
    const verifyUrl = API.base + "sertifikat.html?no=";

    // Ilustrasi vektor blok kiri (warna logo): gelombang penyebaran, jaringan data, kurva epidemi
    function bandArt() {
      const R = "#bc1416", G = "#505050";
      let o = '<svg viewBox="0 0 250 792" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<defs><pattern id="bdots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="' + G + '" opacity=".10"/></pattern>' +
        '<linearGradient id="bfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + R + '" stop-opacity=".9"/><stop offset="1" stop-color="' + R + '" stop-opacity=".55"/></linearGradient>' +
        '<linearGradient id="barea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + R + '" stop-opacity=".18"/><stop offset="1" stop-color="' + R + '" stop-opacity="0"/></linearGradient></defs>' +
        '<rect width="250" height="792" fill="url(#bdots)"/>';
      // 1) Gelombang penyebaran (cincin konsentris) + kasus
      const cx = 118, cy = 168;
      [26, 48, 72, 98, 126].forEach((r, i) => {
        o += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + (i % 2 ? G : R) + '" stroke-width="' + (i ? 1 : 1.6) + '" opacity="' + (0.55 - i * 0.08).toFixed(2) + '"' + (i > 1 ? ' stroke-dasharray="' + (i === 2 ? "3 5" : "1 6") + '" stroke-linecap="round"' : "") + "/>";
      });
      o += '<circle cx="' + cx + '" cy="' + cy + '" r="15" fill="' + R + '" opacity=".14"/><circle cx="' + cx + '" cy="' + cy + '" r="7" fill="' + R + '"/>';
      [[26, 30], [26, 200], [48, 80], [48, 250], [48, 150], [72, 20], [72, 120], [72, 310], [98, 200], [98, 60], [126, 165], [126, 280]].forEach(([r, deg], i) => {
        const a = (deg * Math.PI) / 180, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
        o += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (i % 3 === 0 ? 4 : 2.8) + '" fill="' + (i % 3 === 0 ? R : G) + '" opacity="' + (i % 3 === 0 ? .85 : .55) + '"/>';
      });
      // 2) Jaringan data (simpul & sambungan)
      const N = [[40, 360], [96, 338], [160, 372], [212, 344], [64, 420], [130, 432], [196, 418], [34, 486], [104, 498], [170, 480], [222, 506], [70, 552], [146, 548], [204, 572]];
      const E = [[0, 1], [1, 2], [2, 3], [0, 4], [1, 5], [2, 5], [3, 6], [5, 6], [4, 7], [4, 8], [5, 8], [6, 9], [8, 9], [9, 10], [7, 11], [8, 11], [8, 12], [9, 12], [12, 13], [10, 13], [6, 10]];
      E.forEach(([a, b], i) => (o += '<line x1="' + N[a][0] + '" y1="' + N[a][1] + '" x2="' + N[b][0] + '" y2="' + N[b][1] + '" stroke="' + (i % 5 === 0 ? R : G) + '" stroke-width="' + (i % 5 === 0 ? 1.3 : .9) + '" opacity="' + (i % 5 === 0 ? .6 : .32) + '"/>'));
      N.forEach(([x, y], i) => {
        const hot = [2, 5, 9, 12].includes(i);
        o += (hot ? '<circle cx="' + x + '" cy="' + y + '" r="9" fill="' + R + '" opacity=".12"/>' : "") +
          '<circle cx="' + x + '" cy="' + y + '" r="' + (hot ? 4.6 : 3.4) + '" fill="#fff" stroke="' + (hot ? R : G) + '" stroke-width="' + (hot ? 2 : 1.4) + '"/>';
      });
      // 3) Kurva epidemi: batang + garis rata-rata bergerak + area
      const base = 728, xs = [], hs = [];
      for (let i = 0; i < 15; i++) { const x = 24 + i * 13.6, z = (i - 6.3) / 3.1; xs.push(x); hs.push(14 + 92 * Math.exp(-z * z / 1.25) + (i % 3 === 1 ? 7 : 0)); }
      o += '<line x1="18" y1="' + base + '" x2="232" y2="' + base + '" stroke="' + G + '" stroke-width="1.2" opacity=".55"/>';
      [base - 40, base - 80, base - 120].forEach((y) => (o += '<line x1="18" y1="' + y + '" x2="232" y2="' + y + '" stroke="' + G + '" stroke-width=".6" stroke-dasharray="2 4" opacity=".25"/>'));
      xs.forEach((x, i) => (o += '<rect x="' + x.toFixed(1) + '" y="' + (base - hs[i]).toFixed(1) + '" width="9.6" height="' + hs[i].toFixed(1) + '" rx="2" fill="' + (hs[i] > 75 ? "url(#bfade)" : G) + '" opacity="' + (hs[i] > 75 ? 1 : .28) + '"/>'));
      const pts = xs.map((x, i) => [x + 4.8, base - (hs[Math.max(0, i - 1)] + hs[i] + hs[Math.min(14, i + 1)]) / 3 - 8]);
      const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      o += '<path d="' + path + " L" + pts[14][0].toFixed(1) + " " + base + " L" + pts[0][0].toFixed(1) + " " + base + ' Z" fill="url(#barea)"/>' +
        '<path d="' + path + '" fill="none" stroke="' + R + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
        pts.filter((_, i) => i % 3 === 0).map((p) => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="#fff" stroke="' + R + '" stroke-width="1.4"/>').join("");
      // 4) Aksen geometris lembut
      o += '<path d="M0 610 C 70 590, 150 640, 250 600 L250 620 C 150 660, 70 610, 0 630 Z" fill="' + R + '" opacity=".06"/>' +
        '<path d="M0 270 C 80 250, 170 300, 250 262" fill="none" stroke="' + G + '" stroke-width=".8" opacity=".25"/>' +
        '<path d="M0 286 C 80 266, 170 316, 250 278" fill="none" stroke="' + R + '" stroke-width=".8" opacity=".25"/>';
      return o + "</svg>";
    }

    // Segel emas (SVG vektor — tajam saat dicetak): rosette bergerigi, cincin, teks melengkung, pita
    function seal(jp) {
      const cx = 59, cy = 59, pts = [];
      for (let i = 0; i < 72; i++) { const r = i % 2 ? 51.5 : 57, a = (Math.PI * i) / 36; pts.push((cx + r * Math.sin(a)).toFixed(2) + "," + (cy - r * Math.cos(a)).toFixed(2)); }
      const dots = Array.from({ length: 40 }, (_, i) => { const a = (Math.PI * 2 * i) / 40; return '<circle cx="' + (cx + 45.5 * Math.sin(a)).toFixed(2) + '" cy="' + (cy - 45.5 * Math.cos(a)).toFixed(2) + '" r=".75" fill="#fff6d6" opacity=".9"/>'; }).join("");
      // Emboss: bayangan gelap (kanan-bawah) + kilau terang (kiri-atas) + isi emas
      const emb = (inner, attrs) =>
        '<text ' + attrs + ' fill="#5a410c" opacity=".75" transform="translate(.55 .65)">' + inner + "</text>" +
        '<text ' + attrs + ' fill="#fff4c9" transform="translate(-.45 -.5)">' + inner + "</text>" +
        '<text ' + attrs + ' fill="url(#tg)">' + inner + "</text>";
      const F = 'font-family="Poppins, sans-serif" text-anchor="middle"';
      return '<svg class="seal" viewBox="0 0 118 140" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-label="Segel publichealth.id ' + esc(jp) + ' JP">' +
        '<defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e6a8"/><stop offset=".4" stop-color="#d9b65e"/><stop offset=".72" stop-color="#b48f3d"/><stop offset="1" stop-color="#7a5b1c"/></linearGradient>' +
        '<radialGradient id="sf" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#fbedbd"/><stop offset=".5" stop-color="#dcb960"/><stop offset="1" stop-color="#a27e2d"/></radialGradient>' +
        '<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a24a"/><stop offset="1" stop-color="#94711f"/></linearGradient>' +
        '<path id="arcTop" d="M 23.4 48.8 A 37 37 0 0 1 94.6 48.8"/><path id="arcBot" d="M 26.6 74.1 A 35.5 35.5 0 0 0 91.4 74.1"/></defs>' +
        '<path d="M44 92 L29 137 L40.5 130 L47.5 140 L57 98 Z" fill="#8c0d10"/><path d="M45 93 L31.5 134 L40.8 128.6 L47.6 137 L55.6 98.6 Z" fill="#bc1416"/>' +
        '<path d="M74 92 L89 137 L77.5 130 L70.5 140 L61 98 Z" fill="#2f2f31"/><path d="M73 93 L86.5 134 L77.2 128.6 L70.4 137 L62.4 98.6 Z" fill="#505050"/>' +
        '<polygon points="' + pts.join(" ") + '" fill="url(#sg)" stroke="#7a5b1c" stroke-width=".6"/>' +
        '<circle cx="59" cy="59" r="48.5" fill="url(#sf)" stroke="#7a5b1c" stroke-width="1"/>' + dots +
        '<circle cx="59" cy="59" r="42.5" fill="none" stroke="#7a5b1c" stroke-width=".8"/>' +
        '<circle cx="59" cy="59" r="41.6" fill="none" stroke="#fff4c9" stroke-width=".5" opacity=".8"/>' +
        // garis ornamen di sekitar tulisan tengah
        '<path d="M40 48.5 H78 M44 77.5 H74" stroke="#8a6a22" stroke-width=".6" opacity=".75"/>' +
        '<path d="M40 49.1 H78 M44 78.1 H74" stroke="#fff4c9" stroke-width=".4" opacity=".75"/>' +
        '<path d="M59 45.6 l1.6 2.9 -1.6 2.9 -1.6 -2.9 Z M59 74.6 l1.6 2.9 -1.6 2.9 -1.6 -2.9 Z" fill="#8a6a22"/>' +
        emb("publichealth", F + ' x="59" y="62" font-weight="800" font-size="10.2" letter-spacing=".1"') +
        emb(".id", F + ' x="59" y="72" font-weight="800" font-size="8.6" letter-spacing=".5"') +
        emb('<textPath href="#arcTop" xlink:href="#arcTop" startOffset="50%">BETTER HEALTH · BRIGHTER FUTURE</textPath>', 'font-family="Poppins, sans-serif" text-anchor="middle" font-weight="700" font-size="4.15" letter-spacing=".3"') +
        emb('<textPath href="#arcBot" xlink:href="#arcBot" startOffset="50%">' + esc(jp) + " JAM PELAJARAN</textPath>", 'font-family="Poppins, sans-serif" text-anchor="middle" font-weight="700" font-size="5.6" letter-spacing="1.2"') +
        "</svg>";
    }

    function render(c) {
      const O = C.ORGANIZER, date = fmtDate(c.date + "T12:00:00+07:00");
      const vurl = verifyUrl + encodeURIComponent(c.no);
      $("cert").innerHTML =
        '<div class="band">' + bandArt() + "</div>" +
        '<div class="body"><div class="top"><div><div class="kicker">Sertifikat Pelatihan</div><h1>SERTIFIKAT</h1><div class="no">No. ' + esc(c.no) + "</div></div>" +
        '<div><div class="org-by">Penyelenggara</div><img class="org-logo" src="' + O.logo + '" alt="publichealth.id — ' + esc(O.motto) + '"></div></div>' +
        '<div class="given">Diberikan kepada</div><div class="nm">' + esc(c.name) + '</div><div class="inst">' + esc(c.institution) + "</div>" +
        '<div class="desc">atas partisipasinya sebagai <b>Peserta</b> dan telah menyelesaikan Pelatihan Online<br><b>' + esc(T.title) + " " + esc(T.subtitle) +
        "</b><br>yang diselenggarakan oleh <b>publichealth.id</b> · " + esc(c.batch) + " · " + esc(c.jp) + " Jam Pelajaran (JP)</div>" +
        '<div class="foot">' +
          '<div class="verify"><div class="qr" id="qr"></div><div>Pindai untuk verifikasi keaslian:<br><b>' + esc(verifyUrl.replace(/^https?:\/\//, "")) + "<wbr>" + esc(c.no) + "</b><br>Diterbitkan " + esc(date) + "</div></div>" +
          seal(c.jp) +
          '<div class="sign"><span>Padang, ' + esc(date) + '</span><div class="sp"></div><b>' + esc(T.instructor) + "</b><span>Narasumber · publichealth.id</span></div>" +
        "</div></div>" +
        '<div class="motto">publichealth.id · ' + esc(O.motto) + "</div>";
      try { new QRCode($("qr"), { text: vurl, width: 256, height: 256, colorDark: "#2f2f31", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); }
      catch (e) { $("qr").remove(); }
      $("certWrap").classList.remove("hidden");
      fitName();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitName);
      fit();
    }
    function fitName() {
      const nm = document.querySelector("#cert .nm");
      if (!nm) return;
      let size = 64;
      nm.style.fontSize = size + "px";
      while (nm.scrollWidth > nm.clientWidth && size > 34) nm.style.fontSize = (size -= 2) + "px";
    }
    function fit() {
      const w = $("certWrap").clientWidth, el = $("cert");
      const k = Math.min(1, w / 1122);
      el.style.transform = k < 1 ? "scale(" + k + ")" : "";
      el.style.marginBottom = k < 1 ? -(792 * (1 - k)) + "px" : "";
      el.style.marginLeft = k < 1 ? "0" : "";
    }
    addEventListener("resize", () => $("cert").innerHTML && fit());

    async function verify(no) {
      $("vOut").innerHTML = '<p class="muted">Memeriksa…</p>';
      try {
        const r = await API.verify(no);
        if (!r.valid) { $("vOut").innerHTML = '<div class="alert alert-err">✗ Nomor sertifikat <b>' + esc(no) + "</b> tidak terdaftar.</div>"; $("certWrap").classList.add("hidden"); return; }
        $("vOut").innerHTML = '<div class="alert alert-ok">✓ Sertifikat <b>SAH</b> — diterbitkan untuk <b>' + esc(r.cert.name) + "</b> (" + esc(r.cert.institution) + "), " + esc(fmtDate(r.cert.date + "T12:00:00+07:00")) + ", diterbitkan oleh publichealth.id.</div>";
        render(r.cert);
      } catch (e) { $("vOut").innerHTML = '<div class="alert alert-err">' + esc(e.message) + "</div>"; }
    }
    $("vForm").addEventListener("submit", (e) => { e.preventDefault(); const no = $("vNo").value.trim(); if (no) verify(no); });

    if (qs.get("cetak")) {
      const s = Session.get();
      if (!s) { location.replace("masuk.html?next=" + encodeURIComponent("sertifikat.html?cetak=1")); return; }
      try {
        const r = await API.login(s.email, s.code, true);
        const p = r.participant;
        if (p.certIssued && !p.certNo) { location.replace("evaluasi.html"); return; }
        if (!p.certNo) throw new Error("Sertifikat Anda belum diterbitkan.");
        $("verifyBox").classList.add("hidden");
        $("printBar").classList.remove("hidden");
        render({ no: p.certNo, name: p.name, institution: p.institution, date: p.certDate, jp: p.jp, batch: p.batch });
      } catch (e) { $("vOut").innerHTML = '<div class="alert alert-err">' + esc(e.message) + "</div>"; }
    } else if (qs.get("no")) { $("vNo").value = qs.get("no"); verify(qs.get("no")); }
  })();
  </script>
</body>
</html>
