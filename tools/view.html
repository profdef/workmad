<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../assets/brand/favicon.png">
  <title>Membuka materi…</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; color: #e9e8ff; font: 15px/1.5 system-ui, sans-serif;
      background: radial-gradient(1200px 700px at 85% -10%, rgba(91,43,214,.55), transparent 60%), linear-gradient(160deg, #070b2b, #0d1340 55%, #1c1a6e); }
    .box { text-align: center; max-width: 440px; padding: 24px; }
    .spin { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%; border: 4px solid rgba(168,85,247,.25); border-top-color: #e879f9; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .bar { height: 4px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin-top: 12px; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #a855f7, #e879f9, #38bdf8); transition: width .2s; }
    a { color: #38bdf8; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="box" id="box"><div class="spin"></div><div id="msg">Membuka materi…</div><div class="bar"><i id="bar"></i></div></div>
  <script src="../assets/config.js?v=14"></script>
  <script src="../assets/api.js?v=11"></script>
  <script src="../assets/materi.js?v=11"></script>
  <script src="catalog.js?v=11"></script>
  <script>
  (async function () {
    const slug = (new URLSearchParams(location.search).get("d") || "").replace(/[^\w-]/g, "");
    const s = Session.get();
    if (!s || !(s.key || s.keyFree)) { location.replace("../masuk.html?next=" + encodeURIComponent("materi/view.html?d=" + slug)); return; }
    try {
      if (!slug) throw new Error("Modul tidak dipilih");
      // Deck pengenalan (kelas gratis) memakai kunci terpisah
      const deck = ((window.MATERI || { parts: [] }).parts.flatMap((p) => p.decks)).find((d) => d.slug === slug) || {};
      const key = deck.free ? s.keyFree : s.key;
      if (!key) throw new Error("Modul ini termasuk pelatihan penuh. Daftar pelatihan penuh untuk membukanya (pembeli buku mendapat potongan).");
      const buf = await Materi.open("enc/" + slug + ".bin", key, (p) => (document.getElementById("bar").style.width = Math.round(p * 100) + "%"));
      let html = new TextDecoder().decode(buf);
      await API.track(slug);
      // Tombol kembali ke portal & tanda pengguna (watermark ringan)
      const back = '<a href="../portal.html" title="Kembali ke Portal Peserta" style="position:fixed;z-index:9999;top:12px;left:12px;' +
        'font:600 13px Poppins,system-ui,sans-serif;color:#fff;text-decoration:none;padding:7px 14px;border-radius:999px;' +
        'background:rgba(7,11,43,.72);border:1px solid rgba(168,85,247,.6);backdrop-filter:blur(6px)">← Portal</a>' +
        '<div aria-hidden="true" style="position:fixed;z-index:9998;bottom:6px;right:12px;font:11px system-ui;color:rgba(233,232,255,.35);pointer-events:none">' +
        esc(s.name) + ' · ' + esc(s.email) + '</div>';
      html = html.replace(/<\/body>/i, back + "</body>");
      document.open(); document.write(html); document.close();
    } catch (e) {
      document.getElementById("box").innerHTML = '<div class="err"><b>Materi tidak dapat dibuka.</b><br>' + esc(e.message) +
        '</div><p><a href="../portal.html">← Kembali ke Portal</a></p>';
    }
  })();
  </script>
</body>
</html>
